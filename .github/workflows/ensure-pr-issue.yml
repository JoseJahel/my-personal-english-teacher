name: ensure-pr-issue

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  asegurar-issue:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Asegurar issue de cierre ligado al PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const closerRe =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*(?:#\d+|https?:\/\/github\.com\/[^/\s]+\/[^/\s]+\/issues\/\d+)/i;
            const markerRe = /<!--\s*ensure-pr-issue:(\d+)\s*-->/;

            if (markerRe.test(body) || closerRe.test(body)) {
              core.info('El PR ya cita un issue de cierre o el marcador; no-op.');
              return;
            }

            try {
              const data = await github.graphql(
                `query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 20) {
                        nodes { number }
                      }
                    }
                  }
                }`,
                { owner, name: repo, number: pr.number }
              );
              const nodes =
                data.repository.pullRequest.closingIssuesReferences.nodes || [];
              if (nodes.length > 0) {
                core.info(
                  `El PR ya tiene closingIssuesReferences: ${nodes
                    .map((n) => '#' + n.number)
                    .join(', ')}; no-op.`
                );
                return;
              }
            } catch (err) {
              core.warning(
                `No se pudieron leer closingIssuesReferences: ${err.message}`
              );
            }

            const login = (pr.user && pr.user.login) || '';
            const personByLogin = {
              JoseJahel: 'person:jahel',
              'alvarezrebeca753-sudo': 'person:rebeca',
              'luna0809-oss': 'person:luna',
              SaulitoRamirezz: 'person:saul',
              'cesarubau-droid': 'person:cesar',
            };
            const person = personByLogin[login] || null;

            const titleMatch = String(pr.title).match(
              /^(feat|fix|docs|chore|refactor|test|style|perf|ci|build)(?:\(([^)]+)\))?/i
            );
            let typeLabel = 'type:chore';
            let layerLabel = null;
            if (titleMatch) {
              const kind = titleMatch[1].toLowerCase();
              const scope = (titleMatch[2] || '').toLowerCase().trim();
              if (kind === 'feat') typeLabel = 'type:story';
              else if (kind === 'fix') typeLabel = 'type:bug';
              else if (kind === 'docs') typeLabel = 'type:docs';
              else if (kind === 'refactor') typeLabel = 'type:tech-debt';
              const layerByScope = {
                ui: 'layer:ui',
                audio: 'layer:audio',
                dsp: 'layer:dsp',
                ia: 'layer:ia',
                storage: 'layer:storage',
                repo: 'layer:repo',
                docs: 'layer:repo',
              };
              layerLabel = layerByScope[scope] || null;
            }

            const titleText = String(pr.title);
            let hitoLabel = null;
            if (/\[A1\]|avance[\s-]*1/i.test(titleText)) hitoLabel = 'avance-1';
            else if (/\[A2\]|avance[\s-]*2/i.test(titleText)) hitoLabel = 'avance-2';
            else if (/\[Final\]|entrega[\s-]*final/i.test(titleText)) {
              hitoLabel = 'entrega-final';
            }

            const issueBody = [
              '## Auto-creado',
              '',
              'Este issue se creó automáticamente porque el PR no citaba un ticket de cierre.',
              '',
              `- **PR:** #${pr.number} — ${pr.html_url}`,
              `- **Rama:** \`${pr.head.ref}\``,
              `- **Autor:** @${login || 'desconocido'}`,
              '',
              'El merge del PR cierra este issue (`Closes #…` en el cuerpo del PR).',
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner,
              repo,
              title: pr.title,
              body: issueBody,
            });
            const issueNumber = issue.data.number;
            core.info(`Issue #${issueNumber} creado para el PR #${pr.number}.`);

            const optionalLabels = [person, typeLabel, layerLabel, hitoLabel].filter(
              Boolean
            );
            for (const name of optionalLabels) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: [name],
                });
              } catch (err) {
                core.warning(
                  `Label opcional omitido ("${name}"): ${err.message}`
                );
              }
            }

            if (login) {
              try {
                await github.rest.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  assignees: [login],
                });
              } catch (err) {
                core.warning(
                  `Assignee opcional omitido ("${login}"): ${err.message}`
                );
              }
            }

            const marker = `<!-- ensure-pr-issue:${issueNumber} -->`;
            const closer = `Closes #${issueNumber}`;
            const newBody = `${closer}\n${marker}\n\n${body}`.replace(/\s+$/, '') + '\n';
            try {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                body: newBody,
              });
              core.info(`Cuerpo del PR actualizado con ${closer}.`);
            } catch (err) {
              core.warning(
                `No se pudo parchear el cuerpo del PR: ${err.message}`
              );
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: `${closer}\n${marker}`,
              });
            }
